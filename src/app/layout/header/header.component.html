<div class="header-wrapper">
    <mat-toolbar color="primary" class="toolbar">
        <h1 class="toolbar-title">Construo Fruit & Vegetables</h1>
        <div class="search-wrapper">
            <mat-form-field appearance="outline" class="search-field" subscriptSizing="dynamic">
                <input matInput placeholder="Search…" (input)="onSearch($any($event.target).value)" />
                <button mat-icon-button matSuffix>
                    <mat-icon>search</mat-icon>
                </button>
            </mat-form-field>
            <button mat-icon-button aria-label="Cart" [routerLink]="['/cart']" [matBadge]="cartCount()"
                matBadgeOverlap="false" matBadgeColor="accent">
                <mat-icon>shopping_cart</mat-icon>
            </button>
        </div>
    </mat-toolbar>
</div>
