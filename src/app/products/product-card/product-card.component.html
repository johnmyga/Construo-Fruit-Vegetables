<mat-card [routerLink]="['/product', product().id]">
  <div class="product-image-container">
    <img mat-card-image [src]="product().imageUrl" [alt]="product().name" class="product-image"/>
  </div>

    <mat-card-header>
        <mat-card-title>{{ product().name }}</mat-card-title>
        <mat-card-subtitle>{{ product().origin }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
        <p>{{ product().description }}</p>
        <p>{{ product().price }} € / {{ product().unit }}</p>

        <div class="product-classifier">
            @if (product().organic) {
            <span class="chip organic">Organic</span>
            }
            @if (product().portuguese) {
            <span class="chip portuguese">Portuguese</span>
            }
        </div>
    </mat-card-content>
</mat-card>
