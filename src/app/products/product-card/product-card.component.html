<mat-card class="h-100 shadow-sm">
    <img mat-card-image [src]="product().imageUrl" [alt]="product().name" class="object-fit-cover"
        style="height: 180px;" />

    <mat-card-header>
        <mat-card-title class="fw-bold">{{ product().name }}</mat-card-title>
        <mat-card-subtitle>{{ product().origin }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
        <p class="text-muted mb-2">{{ product().description }}</p>
        <p class="fw-semibold">{{ product().price }} € / {{ product().unit }}</p>

        <div class="d-flex gap-2 mt-2">
            @if (product().organic) {
            <span class="badge bg-success">Organic</span>
            }
            @if (product().portuguese) {
            <span class="badge bg-primary">Portuguese</span>
            }
        </div>
    </mat-card-content>
</mat-card>
